[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moughorai"
version = "2.0.0"
description = "Atlas modular static-analysis platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Atlas Contributors" }]
keywords = ["static-analysis", "security", "java", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx",
    "rich",
    "typer",
    "pydantic",
    "PyYAML"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
moughorai = "moughorai.cli:main"
atlas = "moughorai.atlas_cli:main"

[project.urls]
Documentation = "https://github.com/moughor/Atlas/tree/main/docs"
Repository = "https://github.com/moughor/Atlas"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["moughorai*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
